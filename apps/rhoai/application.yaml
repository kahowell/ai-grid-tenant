apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhai-on-openshift
  namespace: openshift-gitops
spec:
  project: default
  sources:
    - repoURL: https://github.com/opendatahub-io/odh-gitops.git
      targetRevision: main
      path: charts/rhai-on-openshift-chart
      helm:
        releaseName: rhai-on-openshift
        valueFiles:
          - $values/apps/rhoai/values.yaml
    - repoURL: https://github.com/kahowell/ai-grid-tenant.git
      targetRevision: HEAD
      ref: values
    # Cluster-scoped manifests alongside the chart (nightly CatalogSource)
    - repoURL: https://github.com/kahowell/ai-grid-tenant.git
      targetRevision: HEAD
      path: apps/rhoai/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: odh-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
